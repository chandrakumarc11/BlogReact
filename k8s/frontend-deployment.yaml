apiVersion: apps/v1
kind: Deployment
metadata:
  name: blog-frontend
  namespace: blogapp

spec:
  replicas: 2

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: blog-frontend

  template:
    metadata:
      labels:
        app: blog-frontend

    spec:
      containers:
        - name: frontend
          image: 079960139717.dkr.ecr.ap-south-2.amazonaws.com/blog-frontend:eks1
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 80

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 15

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
