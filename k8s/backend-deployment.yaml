apiVersion: apps/v1
kind: Deployment
metadata:
  name: blog-backend
  namespace: blogapp

spec:
  replicas: 2

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: blog-backend

  template:
    metadata:
      labels:
        app: blog-backend

    spec:
      containers:
        - name: backend
          image: 079960139717.dkr.ecr.ap-south-2.amazonaws.com/blog-backend:25
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 5000

          envFrom:
            - configMapRef:
                name: blog-backend-config
            - secretRef:
                name: blog-backend-secret

          livenessProbe:
            httpGet:
              path: /healthz
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /healthz
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
